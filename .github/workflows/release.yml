name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Download Dalamud
      run: |
        Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/stg/latest.zip -OutFile latest.zip
        Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"
      shell: pwsh

    - name: Restore dependencies
      run: dotnet restore NaelTTS/NaelTTS.csproj

    - name: Build Release
      run: dotnet build NaelTTS/NaelTTS.csproj -c Release --no-restore

    - name: Create Release
      uses: ncipollo/release-action@v1
      with:
        artifacts: "NaelTTS/bin/Release/NaelTTS/latest.zip,NaelTTS/bin/Release/NaelTTS/NaelTTS.json"
        allowUpdates: true
        draft: false
        prerelease: false
        generateReleaseNotes: true
        asset_name: NaelTTS.json
        asset_content_type: application/json
